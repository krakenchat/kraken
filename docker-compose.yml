services:
  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: pnpm run start:dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret-that-is-at-least-32-characters-long
      - REPLAY_SEGMENTS_PATH=/app/storage/replay-segments
      - REPLAY_EGRESS_OUTPUT_PATH=/out
      - ADMIN_DEBUG_PANEL=true
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
      - egress-data:/app/storage/replay-segments
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
      - ./backend:/spec:ro
    working_dir: /app/frontend
    depends_on:
      - backend
      - redis

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: semaphore
      POSTGRES_DB: semaphore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - "redisdata:/data"

  livekit:
    image: livekit/livekit-server:latest
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
        redis:
          address: redis:6379
        keys:
          devkey: secret-that-is-at-least-32-characters-long
        webhook:
          api_key: devkey
          urls:
            - http://backend:3000/api/livekit/webhook
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  # S3-compatible object storage for local dev/testing of STORAGE_TYPE=S3.
  # Opt-in via profile — doesn't start with a plain `docker compose up`:
  #   docker compose --profile s3 up -d minio
  # Then set in backend/.env: STORAGE_TYPE=S3, S3_BUCKET=semaphore-dev,
  # S3_REGION=us-east-1, S3_ACCESS_KEY_ID=minioadmin,
  # S3_SECRET_ACCESS_KEY=minioadmin, S3_ENDPOINT=http://minio:9000,
  # S3_FORCE_PATH_STYLE=true. See docs-site/docs/installation/configuration.md.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      # - "9001:9001" # Web console — uncomment to browse buckets at http://localhost:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - miniodata:/data

  # One-shot sidecar: creates the dev bucket so the backend doesn't have to.
  # Equivalent manual command if you ever need to re-run it by hand:
  #   docker compose --profile s3 run --rm minio-init
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/semaphore-dev
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  egress-init:
    image: busybox
    volumes:
      - egress-data:/out
    command: chown -R 1001:0 /out
    restart: "no"

  livekit-egress:
    image: livekit/egress:latest
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret-that-is-at-least-32-characters-long
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    volumes:
      - egress-data:/out
    depends_on:
      egress-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  egress-data:
  miniodata:
