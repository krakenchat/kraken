name: Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    # TODO: make this blocking once existing vulnerabilities are resolved.
    # As of 2026-06-09 `pnpm audit --prod` reports 14 high / 9 moderate advisories,
    # all in transitive deps (tar, minimatch, lodash, path-to-regexp,
    # socket.io-parser, defu, effect) without upstream fixes adopted yet.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
