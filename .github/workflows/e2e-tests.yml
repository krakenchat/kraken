name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily full suite at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# One in-flight run per ref; a newer push/dispatch cancels the older run instead
# of letting duplicates pile up (and avoids confusing "cancelled" noise).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Filter voice-related paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            voice:
              - 'frontend/src/features/voice/**'
              - 'frontend/src/hooks/useTrackSubscription.ts'
              - 'frontend/src/hooks/useVoiceEventLog*'
              - 'frontend/src/hooks/useLocalMediaState.ts'
              - 'frontend/src/components/Voice/**'
              - 'frontend/src/components/Settings/AudioVideoSettingsPanel.tsx'
              - 'frontend/src/components/Settings/VoiceSettings.tsx'
              - 'frontend/e2e/voice/**'
              - 'frontend/e2e/fixtures/voice.fixture.ts'
              - 'backend/src/livekit/**'
              - 'backend/prisma/seed-e2e.ts'
              - 'docker-compose.voice-e2e*.yml'
              - 'livekit-e2e.yaml'
              - 'scripts/run-voice-e2e.sh'
              - '.github/workflows/e2e-tests.yml'

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the downloaded browser so most runs skip the ~167 MiB download
      # entirely. Keyed on the lockfile (which pins the Playwright version).
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      # NOTE: no `--with-deps`. The ubuntu-latest image already ships chromium's
      # system libs (apt reported every dep "already the newest version"), and
      # `--with-deps` shells out to apt-get which intermittently HANGS on the
      # runner. The browser-binary download from the Playwright CDN can also be
      # slow/stall, so retry up to 3× on a cache miss. (Both the apt hang and a
      # stalled CDN download had been timing this step out / cancelling nightlies.)
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            echo "Playwright browser install attempt $attempt…"
            if timeout 240 pnpm exec playwright install chromium; then
              echo "Installed."; exit 0
            fi
            echo "Attempt $attempt failed/stalled; retrying…"; sleep 5
          done
          echo "Playwright browser install failed after 3 attempts"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E images with cache
        uses: docker/bake-action@v6
        with:
          files: docker-compose.e2e.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start E2E services
        run: |
          docker compose -f docker-compose.e2e.yml up -d postgres-test redis-test
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if docker compose -f docker-compose.e2e.yml exec -T postgres-test pg_isready -U semaphore > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in {1..15}; do
            if docker compose -f docker-compose.e2e.yml exec -T redis-test redis-cli ping > /dev/null 2>&1; then
              echo "Redis is ready!"
              break
            fi
            sleep 1
          done
          docker compose -f docker-compose.e2e.yml up -d backend-test

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          for i in {1..60}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start"
              docker compose -f docker-compose.e2e.yml logs backend-test --tail=100
              exit 1
            fi
            sleep 2
          done

      - name: Run database migrations
        run: |
          echo "Running database migrations..."
          docker compose -f docker-compose.e2e.yml exec -T backend-test pnpm run prisma:migrate

      - name: Seed test database
        run: |
          echo "Seeding test database..."
          docker compose -f docker-compose.e2e.yml exec -T backend-test pnpm exec ts-node prisma/seed-e2e.ts

      - name: Start frontend
        run: |
          docker compose -f docker-compose.e2e.yml up -d --no-recreate frontend-test
          echo "Verifying backend is still healthy..."
          for i in {1..60}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend lost after frontend start"
              docker compose -f docker-compose.e2e.yml logs backend-test --tail=100
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -s http://localhost:5174 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Frontend failed to start"
              docker compose -f docker-compose.e2e.yml logs frontend-test --tail=50
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: frontend
        run: |
          # Full suite: push to main, schedule, manual dispatch, or PR with "e2e-full" label
          # Smoke only: PR without the label
          if [ "${{ github.event_name }}" = "pull_request" ] && ! echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q "e2e-full"; then
            echo "Running smoke tests only (PR without e2e-full label)"
            pnpm exec playwright test --grep @smoke
          else
            echo "Running full E2E suite (${{ github.event_name }} trigger)"
            pnpm exec playwright test
          fi
        env:
          E2E_BASE_URL: http://localhost:5174
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  voice-e2e:
    name: Voice E2E (real LiveKit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # Heavy: real LiveKit SFU + 2–4 real browsers per spec. Runs on nightly cron
    # and manual dispatch only — NOT on PRs and NOT on push to main. (The job's
    # WebRTC path on GitHub-hosted runners is still unproven — see
    # frontend/e2e/voice/README.md — so it is kept entirely off the
    # push/PR-blocking path until a manual/nightly run goes green there. The full
    # voice suite is verified locally via scripts/run-voice-e2e.sh.)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    env:
      COMPOSE: docker compose -f docker-compose.e2e.yml -f docker-compose.voice-e2e.yml -f docker-compose.voice-e2e.host.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser runs on the RUNNER (host) against http://localhost:5174 —
      # localhost is a secure context, which getUserMedia/mic-publish requires.
      # Cache + retry, same as the e2e job above (no --with-deps: apt hangs on the
      # runner; the CDN download can stall, so retry on a cache miss).
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            echo "Playwright browser install attempt $attempt…"
            if timeout 240 pnpm exec playwright install chromium; then
              echo "Installed."; exit 0
            fi
            echo "Attempt $attempt failed/stalled; retrying…"; sleep 5
          done
          echo "Playwright browser install failed after 3 attempts"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E images with cache
        uses: docker/bake-action@v6
        with:
          files: docker-compose.e2e.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start infra (postgres, redis, real LiveKit)
        run: |
          $COMPOSE up -d postgres-test redis-test livekit-e2e
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if $COMPOSE exec -T postgres-test pg_isready -U semaphore > /dev/null 2>&1; then
              echo "PostgreSQL ready"; break; fi
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in {1..15}; do
            if $COMPOSE exec -T redis-test redis-cli ping > /dev/null 2>&1; then
              echo "Redis ready"; break; fi
            sleep 1
          done

      - name: Start backend
        run: |
          $COMPOSE up -d backend-test
          echo "Waiting for backend..."
          for i in {1..60}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend ready"; break; fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start"; $COMPOSE logs backend-test --tail=100; exit 1; fi
            sleep 2
          done

      - name: Run migrations + seed (incl. voice channels & member user)
        run: |
          $COMPOSE exec -T backend-test pnpm run prisma:migrate
          $COMPOSE exec -T backend-test pnpm exec ts-node prisma/seed-e2e.ts

      - name: Start frontend
        run: |
          $COMPOSE up -d --no-recreate frontend-test
          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -s http://localhost:5174 > /dev/null 2>&1; then
              echo "Frontend ready"; break; fi
            if [ $i -eq 30 ]; then
              echo "Frontend failed to start"; $COMPOSE logs frontend-test --tail=50; exit 1; fi
            sleep 2
          done

      - name: Run voice Playwright specs
        working-directory: frontend
        run: |
          # On PRs, skip the @slow specs (4-party matrix, force-tcp) to bound
          # PR time; nightly/manual/push run the full voice suite.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR run: voice specs excluding @slow"
            pnpm exec playwright test --project=voice --workers=1 --grep-invert @slow
          else
            echo "Full voice suite (incl. @slow)"
            pnpm exec playwright test --project=voice --workers=1
          fi
        env:
          E2E_BASE_URL: http://localhost:5174
          PW_VOICE_OUTPUT_DIR: ${{ github.workspace }}/frontend/test-results/voice
          CI: true

      - name: Upload voice Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload voice test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: voice-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Dump LiveKit logs on failure
        if: failure()
        run: $COMPOSE logs livekit-e2e --tail=200 || true

      - name: Stop Docker services
        if: always()
        run: $COMPOSE down -v
