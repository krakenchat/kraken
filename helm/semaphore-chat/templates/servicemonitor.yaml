{{- /* Requires metrics.enabled too: without METRICS_ENABLED the backend
     serves no /api/metrics and the scrape target would always error. */}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "semaphore-chat.fullname" . }}-backend
  labels:
    {{- include "semaphore-chat.backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "semaphore-chat.backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /api/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
{{- end }}
